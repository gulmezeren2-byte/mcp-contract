name: Release

# Publishes to PyPI when a version tag (e.g. v0.1.0) is pushed, using PyPI
# Trusted Publishing (OIDC) — no API token is stored anywhere. Register the
# trusted publisher once (owner: gulmezeren2-byte, repo: claude-skills-doctor,
# workflow: release.yml). For the first release, register it as a *pending*
# publisher at
# https://pypi.org/manage/account/publishing/ so the tag push creates the project.

on:
  push:
    # Version tags only. The moving `v1` tag that GitHub Actions users pin to
    # also starts with `v`, and must not try to publish an already-published
    # version to PyPI.
    tags: ["v*.*.*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
