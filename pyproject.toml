[project]
name = "mcp-contract"
version = "0.5.0"
description = "Contract testing for MCP servers: snapshot your tool surface, then fail CI when a change would break the agents that depend on it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mehmet Eren Gülmez" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "contract-testing",
    "regression-testing",
    "schema-diff",
    "breaking-changes",
    "ai-agents",
    "llm-tools",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "mcp>=1.2",
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/gulmezeren2-byte/mcp-contract"
Repository = "https://github.com/gulmezeren2-byte/mcp-contract"
Changelog = "https://github.com/gulmezeren2-byte/mcp-contract/blob/main/CHANGELOG.md"

[project.scripts]
mcp-contract = "mcp_contract.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_contract"]

[tool.ruff]
line-length = 96
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer requires Option()/Argument() calls in parameter defaults.
"src/mcp_contract/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
